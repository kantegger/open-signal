name: Deploy Cloudflare scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "apps/worker/**"
      - "infra/cloudflare/**"
      - "infra/registries/**"
      - "python/**"

permissions:
  contents: read

concurrency:
  group: open-signal-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # Self-hosters opt in after provisioning their own account and secrets.
    if: vars.OPEN_SIGNAL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Cloudflare dependencies
        working-directory: infra/cloudflare
        run: npm ci
      - name: Build and deploy Worker and Container
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare
          command: deploy

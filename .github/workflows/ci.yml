name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output gitleaks_checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  $archive$" gitleaks_checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan complete Git history
        run: ./gitleaks git . --log-opts=--all --redact --no-banner

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install worker
        run: pip install -e ./python && pip install ./apps/worker[dev] ./apps/api
      - name: Lint
        run: ruff check python
      - name: Test
        run: pytest apps/worker

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/web
        run: npm install
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        working-directory: infra/cloudflare
        run: npm ci
      - name: Validate generated bindings and types
        working-directory: infra/cloudflare
        run: npm run check

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install worker
        run: pip install -e ./python && pip install ./apps/worker[dev]
      - name: Generate contracts
        run: python scripts/gen_contracts.py
      - name: Round-trip check
        run: python scripts/check_contracts.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install contracts deps
        working-directory: packages/contracts
        run: npm install
      - name: TS typecheck
        working-directory: packages/contracts
        run: npm run typecheck
      - name: Verify generated types are current
        run: git diff --exit-code -- packages/contracts/src packages/contracts/schemas

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: open_signal
          POSTGRES_PASSWORD: open_signal
          POSTGRES_DB: open_signal
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U open_signal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OPEN_SIGNAL_TEST_DATABASE_URL: postgresql://open_signal:open_signal@localhost:5432/open_signal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install worker
        run: pip install -e ./python && pip install ./apps/worker[dev]
      - name: Migrate
        run: OPEN_SIGNAL_DATABASE_URL="$OPEN_SIGNAL_TEST_DATABASE_URL" python -m alembic -c infra/migrations/alembic.ini upgrade head
      - name: Smoke test
        run: OPEN_SIGNAL_DATABASE_URL="$OPEN_SIGNAL_TEST_DATABASE_URL" python scripts/smoke_db.py
      - name: Job queue tests
        run: pytest apps/worker/tests/test_queue.py -q
      - name: Registry tests
        run: pytest apps/worker/tests/test_registry.py -q
      - name: Artifact store tests
        run: pytest apps/worker/tests/test_artifact.py -q
      - name: Polymarket adapter tests
        run: pytest apps/worker/tests/test_polymarket.py -q
      - name: Market observation tests
        run: pytest apps/worker/tests/test_market_obs.py -q
      - name: Canonicalizer tests
        run: pytest apps/worker/tests/test_canonicalizer.py -q
      - name: Candidate detection tests
        run: pytest apps/worker/tests/test_candidates.py -q
      - name: Claim builder tests
        run: pytest apps/worker/tests/test_claim_builder.py -q
      - name: Federal Register tests
        run: pytest apps/worker/tests/test_federal_register.py -q
      - name: Rule status + change detection tests
        run: pytest apps/worker/tests/test_us_rule_status.py apps/worker/tests/test_rule_changes.py -q
      - name: Agent tool registry tests
        run: pytest apps/worker/tests/test_tools.py -q
      - name: Evidence bundle tests
        run: pytest apps/worker/tests/test_evidence.py -q
      - name: Agent runtime tests
        run: pytest apps/worker/tests/test_runtime.py -q
      - name: Rules charter agent tests
        run: pytest apps/worker/tests/test_rules_agent.py -q
      - name: Expectations charter agent tests
        run: pytest apps/worker/tests/test_expectations_agent.py -q
      - name: Research source tests
        run: pytest apps/worker/tests/test_research_sources.py -q
      - name: Research candidate tests
        run: pytest apps/worker/tests/test_research_candidates.py -q
      - name: Research agent tests
        run: pytest apps/worker/tests/test_research_agent.py -q
      - name: Claims ledger tests
        run: pytest apps/worker/tests/test_ledger.py -q
      - name: Claim verification tests
        run: pytest apps/worker/tests/test_verification.py -q
      - name: Composer component tests
        run: pytest apps/worker/tests/test_components.py -q
      - name: Edition composer tests
        run: pytest apps/worker/tests/test_editions.py -q
      - name: Edition writer tests
        run: pytest apps/worker/tests/test_edition_writer.py -q
      - name: Claim page + API tests
        run: pip install -e ./python && pip install ./apps/api && pytest apps/worker/tests/test_claim_page.py -q
      - name: Operations + budget tests
        run: pytest apps/worker/tests/test_ops.py apps/worker/tests/test_budget.py -q
      - name: Retraction + resolution tests
        run: pytest apps/worker/tests/test_retraction.py apps/worker/tests/test_resolution.py -q
      - name: Degraded mode tests
        run: pytest apps/worker/tests/test_degraded.py -q
      - name: Security hardening tests
        run: pytest apps/worker/tests/test_hardening.py -q
      - name: 30-day review metrics tests
        run: pytest apps/worker/tests/test_metrics.py -q
      - name: Shadow environment tests
        run: pytest apps/worker/tests/test_shadow.py -q
      - name: Evaluation harness tests
        run: pytest apps/worker/tests/test_eval.py -q
      - name: Release check tests
        run: pytest apps/worker/tests/test_release.py -q
      - name: Verify offline migration SQL
        run: OPEN_SIGNAL_DATABASE_URL="$OPEN_SIGNAL_TEST_DATABASE_URL" python -m alembic -c infra/migrations/alembic.ini upgrade head --sql > /tmp/mig.sql && grep -c 'CREATE TABLE' /tmp/mig.sql

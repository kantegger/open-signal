name: CI

on:
  push:
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker
        run: pip install ./apps/worker[dev]
      - name: Lint
        run: ruff check python
      - name: Test
        run: pytest apps/worker

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/web
        run: npm install
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker
        run: pip install ./apps/worker[dev]
      - name: Generate contracts
        run: python scripts/gen_contracts.py
      - name: Round-trip check
        run: python scripts/check_contracts.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install contracts deps
        working-directory: packages/contracts
        run: npm install
      - name: TS typecheck
        working-directory: packages/contracts
        run: npm run typecheck
      - name: Verify generated types are current
        run: git diff --exit-code -- packages/contracts/src packages/contracts/schemas

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: open_signal
          POSTGRES_PASSWORD: open_signal
          POSTGRES_DB: open_signal
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U open_signal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OPEN_SIGNAL_DATABASE_URL: postgresql://open_signal:open_signal@localhost:5432/open_signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker
        run: pip install ./apps/worker[dev]
      - name: Migrate
        run: python -m alembic -c infra/migrations/alembic.ini upgrade head
      - name: Smoke test
        run: python scripts/smoke_db.py
      - name: Job queue tests
        run: pytest apps/worker/tests/test_queue.py -q
      - name: Registry tests
        run: pytest apps/worker/tests/test_registry.py -q
      - name: Artifact store tests
        run: pytest apps/worker/tests/test_artifact.py -q
      - name: Polymarket adapter tests
        run: pytest apps/worker/tests/test_polymarket.py -q
      - name: Market observation tests
        run: pytest apps/worker/tests/test_market_obs.py -q
      - name: Canonicalizer tests
        run: pytest apps/worker/tests/test_canonicalizer.py -q
      - name: Candidate detection tests
        run: pytest apps/worker/tests/test_candidates.py -q
      - name: Claim builder tests
        run: pytest apps/worker/tests/test_claim_builder.py -q
      - name: Federal Register tests
        run: pytest apps/worker/tests/test_federal_register.py -q
      - name: Rule status + change detection tests
        run: pytest apps/worker/tests/test_us_rule_status.py apps/worker/tests/test_rule_changes.py -q
      - name: Agent tool registry tests
        run: pytest apps/worker/tests/test_tools.py -q
      - name: Evidence bundle tests
        run: pytest apps/worker/tests/test_evidence.py -q
      - name: Verify offline migration SQL
        run: python -m alembic -c infra/migrations/alembic.ini upgrade head --sql > /tmp/mig.sql && grep -c 'CREATE TABLE' /tmp/mig.sql

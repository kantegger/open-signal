[alembic]
script_location = infra/migrations
prepend_sys_path = .
# URL is overridden by OPEN_SIGNAL_DATABASE_URL in env.py when set.
sqlalchemy.url = postgresql://open_signal:open_signal@localhost:5432/open_signal

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

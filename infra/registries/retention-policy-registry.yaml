version: "1.0.0"
mode: "report_only"

# These windows classify superseded payloads; the newest representation for
# every external object remains hot regardless of age.  No policy in this file
# authorizes a database mutation.
default_hot_days: 30
source_hot_days:
  polymarket-gamma: 7
  openalex: 30
  clinicaltrials-gov: 90
  federal-register: 365

cold_storage:
  compression: "gzip"
  object_prefix: "raw-payload/v1"
  recovery_grace_days: 7
  maximum_rows_per_run: 1000

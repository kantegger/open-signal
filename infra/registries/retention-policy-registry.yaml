version: "2.0.0"
mode: "active"

# These windows classify superseded payloads; the newest representation for
# every external object remains hot regardless of age. Eligible old payloads
# are cleared in bounded transactions while their identity and content hash
# remain in PostgreSQL.
default_hot_days: 30
source_hot_days:
  polymarket-gamma: 2
  openalex: 30
  clinicaltrials-gov: 90
  federal-register: 365

purge:
  maximum_rows_per_run: 1000

[project]
name = "open-signal-worker"
version = "0.1.0"
description = "Open Signal worker: ingestion, canonicalization, agents, claims and composer"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "jsonschema>=4.20,<5",
  "psycopg2-binary>=2.9,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["../python/open_signal"]

[tool.pytest.ini_options]
pythonpath = ["../python"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

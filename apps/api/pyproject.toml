[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-signal-api"
version = "0.1.0"
description = "Open Signal read-only public API (OS-030)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg2-binary>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: open_signal
      POSTGRES_PASSWORD: open_signal
      POSTGRES_DB: open_signal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_signal -d open_signal"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://open_signal:open_signal@db:5432/open_signal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  pgdata:

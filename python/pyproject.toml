[project]
name = "open-signal-core"
version = "0.1.0"
description = "Open Signal core library: sources, canonical, derived, agents, claims, composer"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "jsonschema>=4.20,<5",
  "psycopg2-binary>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_signal"]
